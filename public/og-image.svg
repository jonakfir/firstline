<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- Subtle lime accent line -->
  <line x1="440" y1="420" x2="760" y2="420" stroke="#C8FF00" stroke-width="1.5" opacity="0.5"/>

  <!-- Centered logo group -->
  <g transform="translate(600, 270)">
    <!-- Favicon mark -->
    <g transform="translate(-120, -30)">
      <path d="M6 0 L22 40" stroke="#C8FF00" stroke-width="4" stroke-linecap="round"/>
      <line x1="5" y1="12" x2="20" y2="12" stroke="#C8FF00" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Wordmark -->
    <text x="-82" y="8" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#F5F0E8" letter-spacing="1" text-anchor="start">Firstline</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F5F0E8" opacity="0.7" text-anchor="middle" font-style="italic">The first line that opens the door.</text>
</svg>
